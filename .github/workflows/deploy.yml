name: Auto Deploy MOMSARASA to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Install LFTP Utility
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload Build Files to cPanel via FTP
        run: |
          lftp -c "
          set ftp:ssl-allow false;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          mirror --reverse --delete --verbose ./dist/ /public_html/;
          quit;
          "
